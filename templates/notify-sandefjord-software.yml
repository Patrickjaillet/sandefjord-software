# Template workflow for individual software repositories.
#
# Copy this file to .github/workflows/notify-sandefjord-software.yml in any
# repository tagged with the "sandefjord-software" GitHub topic. It notifies
# the sandefjord-software site the moment a release is published, so the
# site updates immediately instead of waiting for the scheduled resync.
#
# Requires a repository secret SITE_DISPATCH_TOKEN: a GitHub Personal Access
# Token (classic, "repo" scope, or fine-grained with contents:write on
# Patrickjaillet/sandefjord-software) stored on THIS repo.

name: Notify Sandefjord Software site

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sync to sandefjord-software
        run: |
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/Patrickjaillet/sandefjord-software/dispatches \
            -d '{"event_type":"release-published"}'
