name: Content review

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run content check
        id: check
        run: node scripts/check-content.mjs
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find existing tracking issue
        id: existing
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "content-review",
            });
            return issues.data[0]?.number ?? "";
          result-encoding: string

      - name: Open or update issue if problems found
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.check.outputs.report }}
          EXISTING_ISSUE: ${{ steps.existing.outputs.result }}
        with:
          script: |
            const report = process.env.REPORT || "See workflow run logs for details.";
            const body = `Automated weekly content review found issues:\n\n${report}\n\n_Generated by the \`content-check\` workflow._`;
            const existing = process.env.EXISTING_ISSUE;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(existing),
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Content review: issues found",
                body,
                labels: ["content-review"],
              });
            }

      - name: Close tracking issue if resolved
        if: steps.check.outcome == 'success' && steps.existing.outputs.result != ''
        uses: actions/github-script@v7
        env:
          EXISTING_ISSUE: ${{ steps.existing.outputs.result }}
        with:
          script: |
            const issueNumber = Number(process.env.EXISTING_ISSUE);
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: "closed",
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: "Resolved: the latest content review found no issues.",
            });

      - name: Fail workflow if problems found
        if: steps.check.outcome == 'failure'
        run: exit 1
