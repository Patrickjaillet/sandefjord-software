name: Sync GitHub Releases

on:
  schedule:
    - cron: "0 */6 * * *"
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Sync software catalog from GitHub Releases
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync engagement (likes/comments from GitHub Discussions)
        run: npm run sync-engagement
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site
        run: npm run build

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "chore: sync software catalog from GitHub Releases"
          git push
